<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Content-Security-Policy (Phase 6 P4): scripts only from DoseMate's own files (no inline scripts, no eval), no connections to other
       addresses, no plugins, no forms that submit anywhere. 'wasm-unsafe-eval' is needed only by the browser development storage (sql.js).
       style-src is 'self' only (Phase 12 P12-1): no inline style attribute or element is allowed; h() in js/ui/dom.js refuses a style attribute and the colour swatch is set through the element's style object. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#8B7BC7">
  <title>DoseMate</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <header class="appbar">
    <span class="brand"><span class="brand-dot" aria-hidden="true"></span>DoseMate</span>
    <button id="theme-toggle" class="icon-btn" type="button"></button>
  </header>

  <main id="view" tabindex="-1" aria-live="polite"></main>

  <nav id="nav" class="bottom-nav" aria-label="Main navigation"></nav>

  <noscript><p class="noscript-note">DoseMate needs JavaScript to run.</p></noscript>

  <!-- Development storage (browser only). Not the Android database. -->
  <script src="vendor/sql.js/sql-wasm.js"></script>
  <script src="js/db/migrations.js"></script>
  <script src="js/db/database.js"></script>
  <script src="js/services/dose-tracker.js"></script>
  <script src="js/services/medicine-service.js"></script>
  <!-- Pictures (Phase 9): the rules, the picture service, the prescription records, and the two bridges (the Android plugin and the browser stand-in). -->
  <script src="js/services/image-rules.js"></script>
  <script src="js/services/image-service.js"></script>
  <script src="js/services/prescription-service.js"></script>
  <script src="js/services/image-bridge-capacitor.js"></script>
  <script src="js/services/image-bridge-browser.js"></script>
  <script src="js/services/share-bridge-browser.js"></script>
  <script src="js/services/share-bridge-capacitor.js"></script>
  <script src="js/backup/backup-document.js"></script>
  <script src="js/backup/backup-service.js"></script>
  <script src="js/backup/backup-rules.js"></script>
  <script src="js/backup/backup-net-rules.js"></script>
  <script src="js/backup/backup-net-bridge-capacitor.js"></script>
  <script src="js/backup/backup-net-bridge-browser.js"></script>
  <script src="js/backup/backup-vault-browser.js"></script>
  <script src="js/backup/backup-vault-bridge-capacitor.js"></script>
  <script src="js/backup/backup-flow.js"></script>
  <script src="js/services/dose-settler.js"></script>
  <script src="js/services/stock-estimator.js"></script>
  <script src="js/db/driver-browser.js"></script>
  <!-- Start-up safety check for the phone database. Does nothing in a browser; used only inside the Android app. -->
  <script src="js/db/migration-core.js"></script>
  <script src="js/db/native-startup.js"></script>
  <!-- Phone database driver. Does nothing in a browser; used only inside the Android app. -->
  <script src="js/db/driver-capacitor.js"></script>

  <script src="js/ui/dom.js"></script>
  <script src="js/ui/backup-view.js"></script>
  <script src="js/ui/sample-data.js"></script>
  <script src="js/ui/dose-view.js"></script>
  <script src="js/ui/report-view.js"></script>
  <script src="js/ui/report-share.js"></script>
  <script src="js/ui/stock-view.js"></script>
  <script src="js/ui/image-view.js"></script>
  <script src="js/app-version.js"></script>
  <script src="js/ui/startup-problem.js"></script>
  <script src="js/ui/privacy-info.js"></script>
  <script src="js/ui/screens.js"></script>
  <!-- Reminder engine (Android only does anything with it; in a browser it reports "not available"). Loaded in this order, before bootstrap. -->
  <script src="js/notifications/planner.js"></script>
  <script src="js/notifications/privacy.js"></script>
  <script src="js/notifications/request-check.js"></script>
  <script src="js/notifications/refill.js"></script>
  <script src="js/notifications/adapter-capacitor.js"></script>
  <script src="js/notifications/reconciler.js"></script>
  <script src="js/notifications/reminders-service.js"></script>
  <script src="js/bootstrap.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
